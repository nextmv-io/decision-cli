[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >= 1.13.0"]

[project]
authors = [{ email = "support@nextmv.io", name = "Nextmv" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["typer>=0.27.1", "questionary>=2.1.1", "nextmv==1.10.4"]
description = "A CLI for DecisionOps."
dynamic = ["version"]
keywords = [
    "decision engineering",
    "decision science",
    "decisions",
    "nextmv",
    "optimization",
    "operations research",
    "shift scheduling",
    "solver",
    "vehicle routing problem",
]
license = { file = "LICENSE" }
maintainers = [{ email = "support@nextmv.io", name = "Nextmv" }]
name = "decision-cli"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://www.nextmv.io"
Documentation = "https://docs.nextmv.io/python-sdk"
Repository = "https://github.com/nextmv-io/nextmv-py"

[project.scripts]
decision = "decision.cli.main:main"

# Dependencies that are optional for the end user to install.
[project.optional-dependencies]
mcp = ["mcp[cli]>=1.2.0"]
notebook = ["mlflow>=3.9.0"]

[dependency-groups]
# Dependencies for development and testing.
dev = ["ruff==0.16.3"]

[tool.hatch.version]
path = "decision/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["decision"]
